<style>
:root{--b1:#0b0b10;--b2:#2a1f08;--tx:#f8eed2;--ac:#e0b93f;--card:rgba(255,255,255,.08);--on:#1a1305;--hf:'Playfair Display',serif;--fw:800;--rs:25px;--sf:Pacifico,cursive}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:Poppins,sans-serif;color:var(--tx);background:radial-gradient(circle at 50% 0,var(--b2),var(--b1) 75%) fixed;overflow:hidden;transition:.6s}
canvas#cf{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
.orn{position:fixed;top:105vh;z-index:1;pointer-events:none;animation:up linear infinite;opacity:.4}
body.playing .orn{z-index:4;opacity:.55}
@keyframes up{to{transform:translateY(-120vh) rotate(40deg)}}
.top{position:fixed;top:0;left:0;right:0;z-index:6;display:flex;justify-content:space-between;gap:8px;padding:12px 14px}
.pill{background:color-mix(in srgb,var(--b1) 55%,transparent);color:var(--tx);border:1px solid var(--ac);border-radius:30px;padding:8px 14px;font:500 13px Poppins;cursor:pointer;backdrop-filter:blur(8px)}
/* info WhatsApp: kecil & halus (ikon di bar atas + satu baris teks di sampul), tidak menutupi tampilan */
.pill.wa{align-items:center;gap:0;padding:7px 9px;color:#25d366;text-decoration:none;opacity:.7;transition:opacity .3s,gap .3s}
.pill.wa svg{width:18px;height:18px;flex:none;fill:currentColor}
.pill.wa .lb{max-width:0;overflow:hidden;white-space:nowrap;font:500 12px Poppins;color:var(--tx);transition:max-width .35s ease}
.pill.wa:hover,.pill.wa:focus-visible{opacity:1;gap:6px}.pill.wa:hover .lb,.pill.wa:focus-visible .lb{max-width:230px}
.wa-info{margin:4px auto 0;padding:2px 8px;font:400 11.5px/1.4 Poppins,sans-serif;color:var(--tx);opacity:.55;text-decoration:underline;text-underline-offset:3px;text-decoration-color:color-mix(in srgb,#25d366 70%,transparent);text-align:center;max-width:92vw}
.wa-info:hover{opacity:.95}
@media (max-height:560px){.wa-info{display:none!important}}
#cover{position:relative;z-index:2;height:100%;max-width:760px;margin:auto;padding:56px 22px 46px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 1s}
#cover>*{animation:rise 1.1s cubic-bezier(.2,.8,.2,1) both}
#cover>:nth-child(2){animation-delay:.1s}#cover>:nth-child(3){animation-delay:.2s}#cover>:nth-child(4){animation-delay:.32s}#cover>:nth-child(5){animation-delay:.46s}#cover>:nth-child(6){animation-delay:.6s}
@keyframes rise{from{opacity:0;transform:translateY(26px) scale(.97);filter:blur(6px)}}
.cv-frame{position:fixed;inset:12px;z-index:1;pointer-events:none;border:1px solid color-mix(in srgb,var(--ac) 60%,transparent);border-radius:26px;animation:none!important;box-shadow:inset 0 0 60px color-mix(in srgb,var(--ac) 10%,transparent)}
.cv-frame::before{content:"";position:absolute;inset:6px;border:1px solid color-mix(in srgb,var(--ac) 28%,transparent);border-radius:21px}
.cv-frame i{position:absolute;width:10px;height:10px;background:var(--ac);transform:rotate(45deg);box-shadow:0 0 14px var(--ac)}
.cv-frame i:nth-child(1){left:-5px;top:-5px}.cv-frame i:nth-child(2){right:-5px;top:-5px}.cv-frame i:nth-child(3){left:-5px;bottom:-5px}.cv-frame i:nth-child(4){right:-5px;bottom:-5px}
.sub{letter-spacing:5px;font-size:12px;color:var(--ac);text-transform:uppercase}
h1{font-family:var(--hf);font-weight:var(--fw);font-size:clamp(36px,10vw,64px);margin:8px 0;line-height:1.1;text-shadow:0 2px 18px color-mix(in srgb,var(--ac) 40%,transparent)}
h1 em{font:400 1em var(--sf);color:var(--ac);display:inline-block;padding:0 .08em .12em}
.hint{margin-top:14px;font-size:12px;letter-spacing:1px;opacity:.7}
.ringbox{position:relative;width:min(80vw,38vh,400px);aspect-ratio:1;margin:14px auto;flex:none}
.ringbox::before{content:"";position:absolute;inset:8%;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--ac) 38%,transparent),transparent 68%);filter:blur(18px);animation:halo 4s ease-in-out infinite}
@keyframes halo{50%{transform:scale(1.18);opacity:.65}}
.ringbox svg{position:absolute;inset:0;width:100%;animation:spin 28s linear infinite}
.ringbox svg.r2{animation-duration:46s;animation-direction:reverse}
.ringbox text{fill:var(--ac);font-family:var(--hf);font-weight:var(--fw);font-size:var(--rs)}
@keyframes spin{to{transform:rotate(360deg)}}
.frame{position:absolute;inset:17%;border-radius:50%;overflow:hidden;border:4px solid var(--ac);outline:2px solid color-mix(in srgb,var(--ac) 40%,transparent);outline-offset:6px;box-shadow:0 0 40px color-mix(in srgb,var(--ac) 60%,transparent),inset 0 0 30px rgba(0,0,0,.35);background:var(--card);display:grid;place-items:center;font-size:60px;animation:pulse 3s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.04)}}
.frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.2s}
.frame img.on{opacity:1}
.btn{border-radius:50px;padding:17px 40px;font:600 17px Poppins;letter-spacing:1.2px;text-transform:uppercase;animation:bob 2.4s ease-in-out infinite!important}
@keyframes bob{50%{transform:translateY(-5px)}}

/* ===== PERTUNJUKAN OTOMATIS ===== */
#show{position:fixed;inset:0;z-index:3;display:none;opacity:0;transition:opacity 1.6s;overflow:hidden}
#show.on{opacity:1}
#bg,#bgb,.kb{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.kb{background-size:contain;background-repeat:no-repeat;background-position:center;animation:kb 22s ease-in-out infinite alternate}
@keyframes kb{to{transform:scale(1.04)}}
#bgb,.kb.blur{object-fit:cover;background-size:cover;filter:blur(30px) brightness(.85);transform:scale(1.3);animation:none}
.shade{position:absolute;inset:0;background:linear-gradient(to top,color-mix(in srgb,var(--b1) 92%,transparent) 0,color-mix(in srgb,var(--b1) 60%,transparent) 28%,transparent 52%),linear-gradient(to bottom,color-mix(in srgb,var(--b1) 50%,transparent),transparent 20%)}
.stage{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 16px 66px;text-align:center}
.stage h1{font-size:clamp(26px,7vw,42px);margin:2px 0}
.stage .sub{font-size:11px;letter-spacing:3px}
.stage .ringbox{position:absolute;top:58px;right:12px;width:min(30vw,26vh,130px);margin:0;animation:fly 1.6s cubic-bezier(.2,.8,.2,1)}
.stage .ringbox.kiri{right:auto;left:12px}
.stage .frame{border-width:2px;font-size:28px;box-shadow:0 0 18px color-mix(in srgb,var(--ac) 60%,transparent)}
@keyframes fly{from{opacity:0;transform:scale(2.6) translateY(30vh)}}
.line{font-family:var(--hf);font-weight:var(--fw);font-size:clamp(22px,6vw,44px);line-height:1.25;min-height:3.1em;display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:.1em .3em;max-width:900px;text-shadow:0 2px 16px color-mix(in srgb,var(--b1) 95%,transparent)}
.w{display:inline-block;opacity:0;animation:wi .9s forwards}
@keyframes wi{from{opacity:0;transform:translateY(40px) scale(.6) rotate(-6deg);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
@keyframes wz{from{opacity:0;transform:translateX(-70px) rotateY(90deg);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
@keyframes wd{from{opacity:0;transform:translateY(-60px) scale(2);filter:blur(10px)}to{opacity:1;transform:none;filter:none}}
@keyframes wb{0%{opacity:0;transform:translateY(60px) scale(.5)}60%{opacity:1;transform:translateY(-14px) scale(1.12)}100%{opacity:1;transform:none}}
@keyframes wr{from{opacity:0;transform:rotate(-140deg) scale(.2)}to{opacity:1;transform:none}}
@keyframes wg{0%{opacity:0;transform:skewX(35deg) translateX(-40px);filter:blur(6px)}35%{opacity:.5;transform:skewX(-12deg) translateX(10px)}55%{opacity:.2}75%{opacity:1;transform:skewX(4deg)}100%{opacity:1;transform:none;filter:none}}
@keyframes wf{from{opacity:0;transform:translateY(22px);filter:blur(5px)}to{opacity:1;transform:none;filter:none}}
body.neon .line,body.neon h1{text-shadow:0 0 8px var(--ac),0 0 26px var(--ac)}
.dim{position:absolute;inset:0;background:var(--b1);opacity:0;transition:opacity 1.2s;pointer-events:none}
#show.gmode .dim{opacity:.66}
.stage>.sub,.stage>h1{transition:opacity .8s,max-height .8s;max-height:120px}
#show.gmode .stage>.sub,#show.gmode .stage>h1{opacity:0;max-height:0;margin:0;overflow:hidden}
.gst{display:flex;flex-direction:column;align-items:center;gap:18px;max-width:min(94vw,1000px);font-family:var(--hf)}
@media (min-aspect-ratio:1/1){.gst{flex-direction:row;gap:36px;text-align:left}}
.gf{position:relative;flex:none;padding:9px;border-radius:20px;background:linear-gradient(135deg,var(--ac),color-mix(in srgb,var(--ac) 35%,#fff) 45%,var(--ac) 70%,color-mix(in srgb,var(--ac) 55%,#000));box-shadow:0 22px 60px rgba(0,0,0,.5),0 0 50px color-mix(in srgb,var(--ac) 55%,transparent);overflow:hidden;animation:gin 1.3s cubic-bezier(.2,.9,.2,1) both,gfl 5s ease-in-out 1.3s infinite}
.gf img{display:block;max-width:min(76vw,400px);max-height:36vh;width:auto;height:auto;border-radius:12px;border:3px solid var(--b1)}
@media (min-aspect-ratio:1/1){.gf img{max-width:40vw;max-height:58vh}}
.gf::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.55) 50%,transparent 65%);transform:translateX(-120%);animation:shn 4.5s ease-in-out 1.5s infinite}
.gf.med{width:clamp(96px,28vw,150px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:clamp(48px,14vw,76px)}
@keyframes gin{from{opacity:0;transform:scale(.55) rotate(-10deg) translateY(50px)}to{opacity:1;transform:rotate(-1.5deg)}}
@keyframes gfl{50%{transform:rotate(1deg) translateY(-6px)}}
@keyframes shn{to{transform:translateX(120%)}}
.gb{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;min-width:0;padding:22px 24px 24px;border-radius:26px;border:1px solid color-mix(in srgb,var(--ac) 50%,transparent);
  background:linear-gradient(160deg,color-mix(in srgb,var(--b1) 66%,transparent),color-mix(in srgb,var(--b1) 40%,transparent));backdrop-filter:blur(16px) saturate(1.3);-webkit-backdrop-filter:blur(16px) saturate(1.3);
  box-shadow:0 24px 70px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.14);animation:gin 1.1s cubic-bezier(.2,.9,.2,1) .15s both}
.gb::before{content:"\201C";position:absolute;left:14px;top:-6px;font:700 84px/1 Georgia,serif;color:var(--ac);opacity:.28;pointer-events:none}
@media (min-aspect-ratio:1/1){.gb{align-items:flex-start}}
.vchip{display:inline-flex;align-items:center;gap:10px;font:500 12px Poppins,sans-serif;letter-spacing:.5px;color:var(--tx);padding:7px 14px 7px 10px;border-radius:30px;border:1px solid color-mix(in srgb,var(--ac) 70%,transparent);background:color-mix(in srgb,var(--ac) 16%,transparent);cursor:default}
button.vchip{cursor:pointer}
.vchip .eq{display:inline-flex;align-items:flex-end;gap:2.5px;height:16px;width:22px}
.vchip .eq i{flex:1;background:var(--ac);border-radius:2px;height:30%;transition:height .3s}
.vchip[data-s=playing] .eq i{animation:eq .9s ease-in-out infinite}
.vchip[data-s=playing] .eq i:nth-child(2){animation-delay:-.3s}.vchip[data-s=playing] .eq i:nth-child(3){animation-delay:-.6s}.vchip[data-s=playing] .eq i:nth-child(4){animation-delay:-.15s}
@keyframes eq{0%,100%{height:25%}50%{height:100%}}
.vchip[data-s=loading] .eq i{animation:eq 1.6s ease-in-out infinite;opacity:.55}
.vchip[data-s=fail]{border-style:dashed;animation:bob 1.6s ease-in-out infinite}
.gn{display:flex;flex-direction:column;align-items:inherit;gap:6px;color:var(--ac);font-size:clamp(26px,7vw,46px);line-height:1.15;text-shadow:0 0 22px color-mix(in srgb,var(--ac) 60%,transparent),0 2px 10px color-mix(in srgb,var(--b1) 90%,transparent)}
.gn small{font:500 clamp(11px,3vw,14px) Poppins,sans-serif;letter-spacing:3px;text-transform:uppercase;color:var(--tx);border:1px solid var(--ac);border-radius:30px;padding:4px 14px;background:color-mix(in srgb,var(--b1) 55%,transparent)}
body:has(#show.gmode) .orn{opacity:.18;transition:opacity 1s}
.gl{width:min(60vw,260px);height:2px;border:0;background:linear-gradient(90deg,transparent,var(--ac),transparent)}
.gmsg{font-size:clamp(17px,4.5vw,30px);line-height:1.45;display:flex;flex-wrap:wrap;justify-content:inherit;gap:.05em .3em;font-weight:var(--fw)}

/* ===== slide teman: responsif HP & PC ===== */
#show.gmode .stage{justify-content:center;padding-top:48px}
#show.gmode .line{max-width:none;width:100%;min-height:0}
.gst{--fh:30vh;width:100%;max-width:min(94vw,1280px);margin-inline:auto;gap:clamp(12px,2.4vh,22px)}
.gf img{max-width:min(64vw,330px);max-height:var(--fh)}
.gb{width:100%;max-width:min(92vw,640px);padding:20px 20px 22px;gap:clamp(6px,1.4vh,12px)}
.gn{font-size:clamp(24px,7vw,38px)}
.gn span{text-wrap:balance}
@media (max-aspect-ratio:1/1){.gmsg.ctr{justify-content:center;text-align:center}}
.gmsg{font-size:clamp(16px,4.6vw,28px);line-height:1.5;max-width:100%;text-wrap:pretty;overflow-wrap:anywhere}
#show.gmode .ringbox{opacity:0;transition:opacity .5s}
body:has(#show.gmode) canvas#cf{z-index:2}  /* saat slide teman: konfeti di belakang kartu agar tulisan tetap jelas */
@media (min-aspect-ratio:1/1){
  .gst{--fh:64vh;gap:clamp(24px,3.2vw,56px);justify-content:center;align-items:center}
  .gf img{max-width:min(36vw,560px);max-height:var(--fh)}
  .gf.med{width:clamp(120px,14vw,220px);font-size:clamp(60px,7vw,110px)}
  .gb{width:auto;flex:0 1 auto;max-width:min(54vw,860px);min-width:min(40vw,360px);padding:26px 34px 30px}
  .gn{font-size:clamp(28px,3.4vw,58px)}
  .gmsg{font-size:clamp(18px,1.9vw,34px)}
}
@media (max-height:480px) and (min-aspect-ratio:1/1){.gb{padding:14px 22px}.gf img{max-height:58vh}}
.tp{position:fixed;top:54px;left:10px;right:10px;max-width:480px;max-height:68vh;overflow:auto;z-index:7;display:none;padding:12px;border-radius:18px;border:1px solid var(--ac);background:color-mix(in srgb,var(--b1) 94%,transparent);backdrop-filter:blur(14px)}
.tp.open{display:block}
.tp h4{color:var(--ac);font:500 12px Poppins;letter-spacing:2px;text-transform:uppercase;margin:12px 4px 4px}
.chip{display:inline-flex;align-items:center;gap:6px;margin:3px;padding:6px 11px;border-radius:20px;border:1px solid transparent;background:var(--card);color:var(--tx);font:500 12px Poppins;cursor:pointer}
.chip.sel{border-color:var(--ac);box-shadow:0 0 10px var(--ac)}
.line.out{animation:fo 1s forwards}
@keyframes fo{to{opacity:0;transform:scale(1.12);filter:blur(10px)}}
.run{position:fixed;left:0;right:0;bottom:0;z-index:5;background:linear-gradient(90deg,color-mix(in srgb,var(--ac) 80%,#000),var(--ac),color-mix(in srgb,var(--ac) 80%,#000));color:var(--on);overflow:hidden;white-space:nowrap;padding:9px 0;font-weight:500;letter-spacing:.4px;box-shadow:0 -6px 24px rgba(0,0,0,.35)}
.run span{display:inline-block;padding-left:100%;animation:mq 22s linear infinite}
@keyframes mq{to{transform:translateX(-100%)}}
#buka:disabled{opacity:.65;animation:none}
</style>
</head>

function unlockAudio(){ // dipanggil di dalam klik "Buka" supaya iOS/Chrome mengizinkan pemutaran otomatis berikutnya
  try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();
    const b=AC.createBuffer(1,1,22050),sr=AC.createBufferSource();sr.buffer=b;sr.connect(AC.destination);sr.start(0)}catch(e){}
  try{vEl.src=Suara.SILENT;const p=vEl.play();if(p&&p.then)p.then(()=>vEl.pause()).catch(()=>{})}catch(e){}}

const decodeBuf=(ctx,ab)=>new Promise((ok,no)=>{const p=ctx.decodeAudioData(ab.slice(0),ok,no);if(p&&p.catch)p.catch(no)});
function stopVoice(){if(curStop){try{curStop()}catch(e){}curStop=null}}
/* -> {done:Promise, stop()} ; melempar error jika tak bisa diputar */
async function playVoice(x,abort){
  const data=await Suara.ambil(x.suara);if(abort&&abort.v)return null;
  stopVoice();
  const url=URL.createObjectURL(new Blob([data.buf],{type:data.mime||"audio/wav"}));
  try{ // 1) elemen audio (paling andal, ikut mode senyap iPhone)
    vEl.pause();vEl.onended=vEl.onerror=null;vEl.src=url;vEl.currentTime=0;vEl.muted=false;vEl.volume=1;
    const done=new Promise(r=>{vEl.onended=r;vEl.onerror=r});
    await vEl.play();
    if(abort&&abort.v){vEl.pause();return null}
    const stop=()=>{vEl.onended=vEl.onerror=null;vEl.pause();setTimeout(()=>URL.revokeObjectURL(url),500)};
    curStop=stop;return {done,stop,via:"el"}
  }catch(e1){
    URL.revokeObjectURL(url);console.warn("Elemen audio gagal, coba WebAudio:",e1);
    if(!AC)throw e1;
    if(AC.state!=="running")await Promise.race([AC.resume(),wait(1500)]);
    if(AC.state!=="running")throw e1;
    const ab=await decodeBuf(AC,data.buf);if(abort&&abort.v)return null;
    const src=AC.createBufferSource();src.buffer=ab;src.connect(AC.destination);
    const done=new Promise(r=>src.onended=r);src.start();
    const stop=()=>{try{src.onended=null;src.stop()}catch(e){}};curStop=stop;return {done,stop,via:"wa"}}}
